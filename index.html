<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Recognition</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Music Recognition</h1>
    <p>Enter a list of songs (comma separated):</p>
    <input type="text" id="songInput" placeholder="e.g. Shape of You, Perfect, Galway Girl">
    <button id="submitBtn">Submit</button>

    <div id="result" class="result"></div>
  </div>

  <script>
    // 获取页面元素
    const submitButton = document.getElementById("submitBtn");
    const songInput = document.getElementById("songInput");
    const resultDiv = document.getElementById("result");

    // 处理表单提交
    submitButton.addEventListener("click", async () => {
      const input = songInput.value.trim();
      if (!input) {
        resultDiv.textContent = "请输入歌曲名称！";
        return;
      }

      try {
        // 调用后端 API 发送歌曲列表
        const response = await fetch("https://two61272-s-project.onrender.com/train", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ songs: input })
        });

        // 处理响应
        if (!response.ok) {
          throw new Error("服务器错误，请稍后再试！");
        }

        const result = await response.json();
        if (result && result.prediction) {
          resultDiv.textContent = `预测结果：${result.prediction}`;
        } else {
          resultDiv.textContent = "未能识别歌曲，请检查格式或歌曲名称！";
        }
      } catch (error) {
        resultDiv.textContent = `错误：${error.message}`;
      }
    });
  </script>
</body>
</html>
